logistic:
  C_values: [0.01, 0.1, 1.0, 10.0]
  penalty: l2
  max_iter: 1000

ridge:
  alpha_values: [0.001, 0.01, 0.1, 1.0]

lasso:
  alpha_values: [0.00001, 0.0001, 0.001, 0.01]
  adaptive_thresholding: true

random_forest:
  n_estimators: 500
  max_depth_values: [3, 5, 7]
  min_samples_leaf_values: [50, 100]

xgboost:
  max_depth_values: [3, 4, 5]
  eta_values: [0.01, 0.05]
  subsample: 0.8
  colsample_bytree: 0.7
  n_estimators: 500
  early_stopping_rounds: 50

lightgbm:
  num_leaves_values: [15, 31, 63]
  learning_rate_values: [0.01, 0.05]
  n_estimators: 500

conformal:
  alpha: 0.10
  method: split
  n_calibration_fraction: 0.20
